<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PostBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-secondary-bg-color,#0e131f);--card:var(--tg-theme-bg-color,#171e2e);--tx:var(--tg-theme-text-color,#eef2ff);--mut:var(--tg-theme-hint-color,#8b96b8);--ln:rgba(127,127,127,.2);--g:linear-gradient(135deg,#3b82f6,#06b6d4);--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--ac:#3b82f6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}.logo small{font-size:10px;font-weight:600;color:var(--mut);background:var(--ln);padding:2px 6px;border-radius:8px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;background:var(--g)}
.c{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.12);animation:in .3s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-size:16px;margin-bottom:8px}.sh2{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:16px 4px 8px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.mut{color:var(--mut);font-size:13px}
button,input{font:inherit;border:0;border-radius:14px;padding:12px 14px;color:var(--tx)}
input{width:100%;background:var(--bg);border:1px solid var(--ln);margin-bottom:8px;outline:none}input:focus{border-color:var(--ac)}
button{background:var(--g);color:#fff;font-weight:700;cursor:pointer;transition:transform .12s,opacity .2s}button:active{transform:scale(.96)}button:disabled{opacity:.45}
button.g{background:var(--ln);color:var(--tx);font-weight:600}button.d{background:var(--bad)}button.s{padding:8px 12px;font-size:13px;border-radius:12px}
.acts{display:flex;gap:8px}.acts button{flex:1}
/* hero */
.hero{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#2563eb,#06b6d4);margin-bottom:6px;animation:in .35s both;position:relative;overflow:hidden}
.hero.off{background:linear-gradient(135deg,#475569,#64748b)}.hero.warn{background:linear-gradient(135deg,#d97706,#f59e0b)}.hero.idle{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.hl{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}.hs{opacity:.9;font-size:13px;margin-top:2px}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pl 1.8s infinite}.hero.off .dot,.hero.idle .dot{animation:none;opacity:.6}
@keyframes pl{70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.hst{display:flex;gap:8px;margin-top:14px}.hst div{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:8px 6px;text-align:center}.hst b{display:block;font-size:22px}.hst span{font-size:11px;opacity:.9}
.hb{margin-top:12px;width:100%;background:rgba(255,255,255,.22);color:#fff;padding:10px}
/* ish qatori */
.jr{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:pointer;animation:in .3s both}
.pi{font-size:22px;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--bg);flex:none}
.jm{flex:1;min-width:0}.pp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;font-weight:600}
.ls{font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ls.ok{color:var(--ok)}.ls.run{color:var(--ac)}.ls.warn{color:var(--warn)}.ls.off{color:var(--mut)}
.sw{position:relative;width:46px;height:28px;flex:none}.sw input{display:none}.sw i{position:absolute;inset:0;background:var(--ln);border-radius:20px;transition:.25s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:after{transform:translateX(18px)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--ln)}
nav button{flex:1;background:none;color:var(--mut);padding:6px 2px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:20px}nav button.on{color:var(--ac)}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));border-radius:99px;padding:14px 20px;box-shadow:0 6px 20px rgba(37,99,235,.45);animation:in .3s both}
/* kirish, post, guruh */
.steps{display:flex;gap:6px;margin-bottom:12px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--ln)}.steps i.on{background:var(--g)}
.hero2{text-align:center;padding:8px 0}.hero2 .em{font-size:44px;display:block}.code{font-size:26px;letter-spacing:10px;text-align:center}
.pills{display:flex;gap:6px;margin-bottom:12px}.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 4px;border-radius:14px;background:var(--card);font-size:12px;color:var(--mut);font-weight:600}
.pill b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ln);font-size:11px;color:var(--tx)}.pill.on{color:var(--tx);box-shadow:0 0 0 1.5px var(--ac)}.pill.on b,.pill.ok b{background:var(--g);color:#fff}.pill.ok{color:var(--tx)}
.post{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;margin:8px 0;background:var(--bg);border:1.5px solid transparent;cursor:pointer;transition:.2s}.post.on{border-color:var(--ac)}
.gr{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;cursor:pointer}.gr.on{background:rgba(59,130,246,.12)}
.gt{flex:1;min-width:0}.gt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gt span{font-size:12px;color:var(--mut)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:14px;color:transparent;flex:none;transition:.2s}.gr.on .ck{background:var(--ac);border-color:var(--ac);color:#fff}
#gl{max-height:46vh;overflow-y:auto;margin-top:8px}
.pre{display:inline-block;margin:4px 4px 0 0;padding:9px 13px;border-radius:99px;background:var(--bg);cursor:pointer}.pre.on{background:var(--g);color:#fff}
.how div{margin:10px 0;display:flex;gap:8px}.num{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--g);font-size:12px;color:#fff}
.empty{text-align:center;padding:22px 8px;color:var(--mut)}.empty i{font-style:normal;font-size:40px;display:block;margin-bottom:6px}
.big{font-size:28px;font-weight:800}.stat{flex:1;text-align:center}.bar{height:5px;border-radius:9px;background:var(--g);margin-top:8px}.err{color:var(--bad);font-size:13px;margin-top:6px;word-break:break-word}
.sk{height:52px;border-radius:14px;margin:8px 0;background:linear-gradient(90deg,var(--ln),rgba(127,127,127,.38),var(--ln));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);max-width:92%;background:#111827;color:#fff;padding:10px 16px;border-radius:14px;z-index:99;font-size:14px;animation:in .3s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;opacity:0;transition:opacity .25s}.ov.on{opacity:1}
.sh{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s}.ov.on .sh{transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="logo">📣 PostBot <small id="ver"></small></div><div id="me" class="me"></div></header>
<div id="v"></div><button id="fab" hidden>＋ Yangi e'lon</button><nav id="nav" hidden></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('secondary_bg_color');tg.setBackgroundColor('secondary_bg_color')}catch(e){}
const $=s=>document.querySelector(s),V=$('#v');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const st={sel:new Map(),iv:60,min:5,authed:false,step:1,mode:'',ad:null,edit:null,jobId:null,addTo:false};let tab='home',gen=0;
const KI={matn:'📝',rasm:'🖼',video:'🎬',sticker:'🎭',fayl:'📎'};
const hm=ts=>ts?new Date(ts*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';
const tm=ts=>ts?new Date(ts*1000).toLocaleString([],{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const fmt=m=>m%1440==0?(m/1440)+' kun':m%60==0?(m/60)+' soat':m+' daq';
const ago=ts=>{const m=Math.round((Date.now()/1000-ts)/60);return m<1?'hozir':m<60?m+' daq oldin':m<1440?Math.round(m/60)+' soat oldin':Math.round(m/1440)+' kun oldin'};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),4500)}
function cu(el,to){to=+to||0;const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/600);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const cus=()=>document.querySelectorAll('[data-cu]').forEach(e=>cu(e,e.dataset.cu));
/* oynalar (Telegram'ning showConfirm'iga bog'liq emas) */
function sheet(inner){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh">${inner}</div>`;document.body.append(o);requestAnimationFrame(()=>o.classList.add('on'));
 const close=()=>{o.classList.remove('on');setTimeout(()=>o.remove(),280)};return{o,close}}
function ask(msg,ok='Ha',danger=false){return new Promise(r=>{const s=sheet(`<p style="margin:2px 0 16px">${msg}</p><div class="acts"><button class="g" id="n">Yo'q</button><button class="${danger?'d':''}" id="y">${ok}</button></div>`);
 s.o.querySelector('#n').onclick=()=>{s.close();r(false)};s.o.querySelector('#y').onclick=()=>{s.close();r(true)};s.o.addEventListener('click',e=>{if(e.target===s.o)r(false)})})}
function menu(title,items){const s=sheet(`<div class="mut" style="margin-bottom:10px">${esc(title)}</div>${items.map((x,i)=>`<button class="${x.d?'d':'g'}" data-i="${i}" style="width:100%;margin-bottom:8px">${x.t}</button>`).join('')}<button class="g" id="cl" style="width:100%">Bekor qilish</button>`);
 s.o.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{s.close();items[b.dataset.i].f()});s.o.querySelector('#cl').onclick=s.close}
async function api(p,m='GET',b){const c=new AbortController();const to=setTimeout(()=>c.abort(),90000);
 const r=await fetch('/api/'+p,{method:m,signal:c.signal,headers:{'X-Init-Data':tg.initData,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).catch(()=>{throw new Error('Server javob bermadi')});clearTimeout(to);
 const j=await r.json().catch(()=>({}));
 if(r.status==401){gen++;login();throw new Error('login')}
 if(!r.ok){const e=j.detail||('Xato '+r.status);toast(e);throw new Error(e)}return j}
const TABS=[['home','🏠','Bosh sahifa'],['stat','📊','Statistika'],['acc','👤','Akkaunt']];
function nav(){const n=$('#nav');n.hidden=false;n.innerHTML=TABS.map(([k,i,t])=>`<button class="${k==tab?'on':''}" data-k="${k}"><span>${i}</span>${t}</button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;st.jobId=null;st.addTo=false;nav();show()})}
function setMe(n){$('#me').innerHTML=n?`${esc(n)}<div class="av">${esc(n[0].toUpperCase())}</div>`:''}
async function boot(){gen++;try{const s=await api('state');st.min=s.min||5;if(s.auth){st.authed=true;setMe(s.me);nav();show()}else login()}catch(e){if(e.message!=='login')V.innerHTML=`<div class="c"><b>Xato</b><div class="err">${esc(e.message)}</div></div>`}}
/* ---------- kirish ---------- */
function login(step=1){st.authed=false;$('#nav').hidden=true;$('#fab').hidden=true;setMe('');
 const bar=n=>`<div class="steps"><i class="on"></i><i class="${n>1?'on':''}"></i><i class="${n>2?'on':''}"></i></div>`;
 if(step==1){V.innerHTML=`<div class="c"><div class="hero2"><span class="em">📱</span><h2 style="font-size:20px">Telegram akkauntni ulang</h2><p class="mut">Telefon raqamingizni kiriting, Telegram'ga kod keladi.</p></div>${bar(1)}
 <input id="ph" value="+998" inputmode="tel" autocomplete="tel"><button id="go" style="width:100%">Kod yuborish</button>
 <p class="mut" style="margin-top:10px">Akkaunt kaliti shu xizmat serverida saqlanadi, «Akkaunt» bo'limidan istalgan payt uzishingiz mumkin. Juda tez-tez yoki ko'p guruhga yuborish Telegram tomonidan cheklanishga olib kelishi mumkin.</p>
 <button class="g s" id="dg" style="margin-top:10px">🩺 Tekshiruv</button></div>`;$('#dg').onclick=showDiag;
  $('#go').onclick=async e=>{const b=e.target;b.disabled=true;try{const r=await api('send_code','POST',{phone:$('#ph').value});if(r.already){boot();return}login(2)}catch(x){if(x.message!=='login')b.disabled=false}}}
 else if(step==2){V.innerHTML=`<div class="c"><div class="hero2"><span class="em">💬</span><h2 style="font-size:20px">Kodni kiriting</h2><p class="mut">Kod Telegram'dagi «Telegram» chatiga keldi. Uni hech kimga yubormang.</p></div>${bar(2)}
 <input id="cd" class="code" placeholder="•••••" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="ok" style="width:100%">Kirish</button><button class="g" id="bk" style="width:100%;margin-top:8px">← Raqamni o'zgartirish</button></div>`;
  $('#bk').onclick=()=>login(1);$('#ok').onclick=()=>doLogin()}
 else{V.innerHTML=`<div class="c"><div class="hero2"><span class="em">🔐</span><h2 style="font-size:20px">2 bosqichli parol</h2><p class="mut">Akkauntingizda parol yoqilgan. Uni kiriting.</p></div>${bar(3)}
 <input id="pw" type="password" placeholder="Parol"><button id="ok" style="width:100%">Kirish</button></div>`;$('#ok').onclick=()=>doLogin(1)}}
async function doLogin(pw){const b=$('#ok');b.disabled=true;
 try{const r=await api('login','POST',pw?{password:$('#pw').value}:{code:$('#cd').value.trim()});
  if(r.need_password){login(3);return}toast('Ulandi ✅');tab='home';boot()}catch(x){if(x.message!=='login')b.disabled=false}}
async function show(silent){const g=++gen;$('#fab').hidden=!(tab==='home'&&!st.jobId&&st.authed);
 if(!silent)V.innerHTML='<div class="c"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
 try{await ({home:vHome,stat:vStat,acc:vAcc,new:vNew})[tab](g);cus()}catch(e){if(e.message!=='login'&&g===gen)V.innerHTML=`<div class="c"><b>Xato</b><div class="err">${esc(e.message)}</div></div>`}}
/* ---------- bosh sahifa ---------- */
function live(x){const l=x.live||{};
 if(!x.active)return['off','⏸ To\'xtatilgan'];
 if(l.state==='run')return['run','🔄 Yuborilmoqda '+(l.prog||'')];
 if(l.state==='queue')return['run','🕒 Navbatda'];
 if(l.state==='flood')return['warn','⏳ Telegram cheklov qo\'ydi · '+hm(l.until)+' da davom etadi'];
 if(x.err)return['warn','⚠️ '+x.err];
 return['ok','🟢 Keyingi yuborish: '+(x.next_run<=Date.now()/1000?'hozir':hm(x.next_run))]}
const row=x=>{const[c,t]=live(x);return`<div class="jr" data-o="${x.id}"><div class="pi">${KI[x.kind]||'📝'}</div><div class="jm"><div class="pp">${esc(x.preview||x.title)}</div>
 <div class="mut">${x.chats.length} guruh · har ${fmt(x.interval)} · 📤 ${x.sent_n}</div><div class="ls ${c}">${esc(t)}</div></div>
 <label class="sw"><input type="checkbox" ${x.active?'checked':''}><i></i></label></div>`};
async function vHome(g){if(st.jobId)return vJob(g);const h=await api('home');if(g!==gen)return;$('#ver').textContent='v'+(h.v||'');const now=Date.now()/1000;
 const act=h.jobs.filter(x=>x.active).length;let cls='',t='Ishlayapti',sub=h.next?'Keyingi yuborish: '+(h.next<=now?'hozir':hm(h.next)):'';
 if(h.flood>now){cls='warn';t='Telegram cheklov qo\'ydi';sub='Avtomatik davom etadi: '+hm(h.flood)}
 else if(!h.jobs.length){cls='idle';t='Hali e\'lon yo\'q';sub='«＋ Yangi e\'lon» tugmasi bilan boshlang'}
 else if(!act){cls='off';t='Hammasi to\'xtatilgan';sub=''}
 V.innerHTML=`<div class="hero ${cls}"><div class="hl"><span class="dot"></span>${t}</div><div class="hs">${sub}</div>
 <div class="hst"><div><b data-cu="${act}">0</b><span>faol e'lon</span></div><div><b data-cu="${h.today}">0</b><span>24 soatda yuborildi</span></div><div><b data-cu="${h.jobs.reduce((a,x)=>a+x.chats.length,0)}">0</b><span>guruh</span></div></div>
 ${act?'<button class="hb" id="pa">⏸ Hammasini to\'xtatish</button>':''}</div>
 <div class="sh2">E'lonlar</div>${h.jobs.map(row).join('')||'<div class="c empty"><i>📭</i>Hali e\'lon yo\'q.<br>Pastdagi «＋ Yangi e\'lon» ni bosing.</div>'}`;
 const pa=$('#pa');if(pa)pa.onclick=async()=>{if(await ask('Barcha e\'lonlarni to\'xtatamizmi?','To\'xtatish',true)){await api('pause_all','POST');toast('Hammasi to\'xtatildi');show()}};
 V.querySelectorAll('.jr').forEach(r=>r.onclick=async e=>{const id=+r.dataset.o;
  if(e.target.closest('.sw')){e.preventDefault();try{await api(`jobs/${id}/toggle`,'POST')}catch(x){}show();return}st.jobId=id;show()})}
/* ---------- bitta e'lon ---------- */
async function vJob(g){if(st.addTo)return vAddGroup(g);let d;try{d=await api('jobs/'+st.jobId)}catch(e){st.jobId=null;if(e.message!=='login')show();return}if(g!==gen)return;
 const j=d.job,mx=Math.max(1,...d.groups.map(x=>x.n));const[c,t]=live({...j,live:d.live,err:d.err});
 V.innerHTML=`<button class="g s" id="bk">← Orqaga</button>
 <div class="c" style="margin-top:10px"><div class="post" style="cursor:default"><div class="pi">${KI[j.kind]||'📝'}</div><div class="jm"><div class="pp">${esc(j.preview)}</div><div class="mut">${j.chats.length} guruh · har ${fmt(j.interval)}</div></div></div>
 <div class="ls ${c}" style="font-size:13px">${esc(t)}</div>${d.err&&!t.includes(d.err)?`<div class="err">⚠️ ${esc(d.err)}</div>`:''}
 <div class="acts" style="margin-top:12px"><button class="s" id="nw">▶️ Hozir yuborish</button><button class="s g" id="tgl">${j.active?'⏸ To\'xtatish':'▶️ Yoqish'}</button></div>
 <div class="acts" style="margin-top:8px"><button class="s g" id="ed">✏️ Tahrirlash</button><button class="s d" id="rm">🗑 O'chirish</button></div></div>
 <div class="c row"><div class="stat"><div class="big" data-cu="${d.total}">0</div><div class="mut">yuborildi</div></div><div class="stat"><div class="big" data-cu="${d.replies}">0</div><div class="mut">reply</div></div><div class="stat"><div class="big" data-cu="${d.people}">0</div><div class="mut">odam</div></div></div>
 <div class="mut" style="margin:0 4px">Oxirgi yuborish: ${tm(d.last)}</div>
 <div class="row" style="margin:14px 2px 8px"><div class="sh2" style="margin:0">Guruhlar (${d.groups.length})</div><button class="s" id="ag">＋ Qo'shish</button></div>
 ${d.groups.map(x=>`<div class="c"><div class="row"><div class="gt"><b>${esc(x.title)}</b><span>${x.n} marta · ${x.rep} reply · ${x.ppl} kishi · oxirgi: ${tm(x.last)}</span></div><button class="s g" data-mn="${x.id}" data-t="${esc(x.title)}">⋯</button></div>
 ${x.err?`<div class="err">⚠️ ${esc(x.err)}</div>`:''}<div class="bar" style="width:${x.n/mx*100}%"></div></div>`).join('')}`;
 $('#bk').onclick=()=>{st.jobId=null;show()};
 $('#nw').onclick=async()=>{await api(`jobs/${j.id}/now`,'POST');toast('Yuborish boshlanadi (bir necha soniyada)');show()};
 $('#tgl').onclick=async()=>{await api(`jobs/${j.id}/toggle`,'POST');show()};
 $('#ag').onclick=()=>{st.addTo=true;show()};
 $('#ed').onclick=()=>{st.edit=j.id;st.ad=j.ad_id;st.sel=new Map(j.chats.map(c=>[c.id,c.title]));st.iv=j.interval;st.step=1;st.mode='';tab='new';show()};
 $('#rm').onclick=async()=>{if(await ask('E\'lonni o\'chiraymi? (Post saqlanib qoladi)','O\'chirish',true)){await api('jobs/'+j.id,'DELETE');st.jobId=null;toast('O\'chirildi');show()}};
 V.querySelectorAll('[data-mn]').forEach(b=>b.onclick=()=>menu(b.dataset.t,[
  {t:'➖ Shu e\'londan chiqarish',f:async()=>{try{await api(`jobs/${j.id}/chats/${b.dataset.mn}`,'DELETE');toast('Chiqarildi');show()}catch(e){}}},
  {t:'🚪 Telegram\'da guruhdan chiqish',d:1,f:async()=>{if(!await ask('Telegram\'da shu guruhdan CHIQASIZ va u barcha e\'lonlardan olib tashlanadi. Davom etamizmi?','Chiqish',true))return;
    try{const r=await api('groups/leave','POST',{id:+b.dataset.mn});toast('Guruhdan chiqildi'+(r.jobs_removed?' · bo\'sh qolgan e\'lon o\'chirildi':''));if(r.jobs_removed)st.jobId=null;show()}catch(e){}}}]))}
async function vAddGroup(g){const d=await api('jobs/'+st.jobId);if(g!==gen)return;const have=new Set(d.job.chats.map(c=>c.id));
 V.innerHTML=`<button class="g s" id="bk">← Orqaga</button><div class="c" style="margin-top:10px"><h2>＋ Guruh qo'shish</h2><div id="gs" class="mut">Guruhlar yuklanmoqda…</div>
 <input id="q" placeholder="🔍 Guruhni qidirish" style="margin-top:8px"><div id="gl"><div class="sk"></div><div class="sk"></div></div></div>`;
 $('#bk').onclick=()=>{st.addTo=false;show()};let gl=[];
 const draw=()=>{const v=$('#q').value.toLowerCase();const s=gl.filter(x=>!have.has(x.id)&&x.title.toLowerCase().includes(v));
  $('#gl').innerHTML=s.map(x=>`<div class="gr" data-g="${x.id}"><div class="av" style="background:hsl(${Math.abs(x.id)%360},60%,45%)">${esc((x.title[0]||'?').toUpperCase())}</div><div class="gt"><b>${esc(x.title)}</b>${x.n?`<span>${x.n} a'zo</span>`:''}</div><div class="ck" style="color:var(--ac);border-color:var(--ac)">+</div></div>`).join('')||'<p class="mut" style="padding:8px">Qo\'shiladigan guruh qolmadi</p>'};
 $('#gl').onclick=async e=>{const r=e.target.closest('.gr');if(!r)return;const i=+r.dataset.g,x=gl.find(y=>y.id===i);try{await api(`jobs/${st.jobId}/chats`,'POST',{add:[{id:i,title:x.title}]});have.add(i);toast('Qo\'shildi ✅');draw()}catch(e){}};
 $('#q').oninput=draw;
 const poll=async()=>{if(g!==gen||!$('#gl'))return;try{const r=await api('groups');if(g!==gen||!$('#gl'))return;gl=r.d;draw();$('#gs').textContent=r.err?'Xato: '+r.err:r.done?'Qo\'shmoqchi bo\'lgan guruhni bosing':'Yuklanmoqda… '+gl.length+' ta topildi';if(!r.done)setTimeout(poll,1200)}catch(e){}};poll()}
/* ---------- yangi e'lon ---------- */
function resetWizard(){st.edit=null;st.mode='';st.step=1;st.ad=null;st.sel.clear()}
function startNew(){resetWizard();tab='new';nav();show()}
$('#fab').onclick=startNew;
document.addEventListener('click',e=>{if(e.target.id==='cx'){const id=st.edit;resetWizard();st.jobId=id;tab='home';nav();show()}});
const pills=n=>(st.edit?'<div class="mut" style="margin-bottom:8px">✏️ Tahrirlash rejimi · <a id="cx" style="color:var(--ac);text-decoration:underline;cursor:pointer">bekor qilish</a></div>':'')+`<div class="pills">${['Post','Guruhlar','Vaqt'].map((t,i)=>`<div class="pill ${i+1==n?'on':i+1<n?'ok':''}"><b>${i+1<n?'✓':i+1}</b>${t}</div>`).join('')}</div>`;
async function vNew(g){if(st.mode=='done')return vDone();if(st.mode=='newpost')return vNewPost(g);if(st.step==2)return vStep2(g);if(st.step==3)return vStep3(g);return vStep1(g)}
async function vStep1(g){const p=await api('posts');if(g!==gen)return;
 if(!st.ad&&!st.edit&&p.length&&Date.now()/1000-p[0].created<600)st.ad=p[0].id;
 if(st.ad&&!p.find(x=>x.id==st.ad))st.ad=null;
 V.innerHTML=pills(1)+`<div class="c"><h2>Qaysi postni tarqatamiz?</h2><button id="np" style="width:100%;margin:4px 0 6px">➕ Yangi post qo'shish</button>
 ${p.map(x=>`<div class="post ${st.ad==x.id?'on':''}" data-a="${x.id}"><div class="pi">${KI[x.kind]||'📝'}</div><div class="jm"><div class="pp">${esc(x.preview)}</div><div class="mut">${esc(x.kind)} · ${ago(x.created)}</div></div><button class="s g" data-d="${x.id}">🗑</button></div>`).join('')
 ||'<div class="empty"><i>📭</i>Hali post yo\'q.<br>«Yangi post qo\'shish» ni bosing va postni botga yuboring.</div>'}</div>
 <div class="acts">${st.edit?'':'<button class="g" id="hm">← Bosh sahifa</button>'}<button id="nx" ${st.ad?'':'disabled'}>Davom etish →</button></div>`;
 $('#np').onclick=()=>{st.mode='newpost';show()};const h=$('#hm');if(h)h.onclick=()=>{tab='home';nav();show()};
 V.querySelectorAll('[data-a]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-d]'))return;st.ad=+c.dataset.a;V.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',x===c));$('#nx').disabled=false});
 V.querySelectorAll('[data-d]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(await ask('Postni va unga bog\'liq e\'lonlarni o\'chiraymi?','O\'chirish',true)){await api('posts/'+b.dataset.d,'DELETE');if(st.ad==b.dataset.d)st.ad=null;show()}});
 $('#nx').onclick=()=>{st.step=2;show()}}
async function vNewPost(g){let bot='';try{bot=(await api('new_post','POST')).bot}catch(e){if(e.message!=='login'){st.mode='';show()}return}
 const known=new Set((await api('posts')).map(x=>x.id));if(g!==gen)return;
 V.innerHTML=`<div class="c"><h2>➕ Yangi post qo'shish</h2><div class="how"><div><span class="num">1</span><span>Pastdagi tugma bilan <b>botga o'ting</b></span></div>
 <div><span class="num">2</span><span>Postni shu yerga yuboring: matn, rasm, video, premium emoji, stiker — qanday bo'lsa, shunday</span></div>
 <div><span class="num">3</span><span>Bot «✅ qabul qilindi» deydi. Keyin <b>ilovaga qayting</b> (botdagi «Ochish» tugmasi)</span></div></div>
 <button id="gb" style="width:100%;margin-top:6px">🤖 Botga o'tish</button><div id="wt" class="mut" style="text-align:center;margin:12px 0 4px">⏳ Post kutilmoqda…</div><button class="g s" id="cn">← Bekor qilish</button></div>`;
 $('#gb').onclick=()=>tg.openTelegramLink('https://t.me/'+bot);$('#cn').onclick=()=>{st.mode='';show()};
 const poll=async()=>{if(g!==gen||!$('#wt'))return;try{const p=await api('posts');const n=p.find(x=>!known.has(x.id));if(n){st.ad=n.id;st.mode='';toast('Post qabul qilindi ✅');show();return}}catch(e){}setTimeout(poll,2000)};setTimeout(poll,2000)}
async function vStep2(g){
 V.innerHTML=pills(2)+`<div class="c"><div class="row"><h2>Qaysi guruhlarga?</h2><span id="cnt" class="mut"></span></div><div id="gs" class="mut">Guruhlar yuklanmoqda…</div>
 <input id="q" placeholder="🔍 Guruhni qidirish" style="margin-top:8px"><div class="acts"><button class="s g" id="all">Ko'ringanlarini tanlash</button><button class="s g" id="none">Tozalash</button><button class="s g" id="rf" style="flex:0">🔄</button></div>
 <div id="gl"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
 <div class="acts"><button class="g" id="bk">← Orqaga</button><button id="nx" disabled>Davom etish →</button></div>`;
 const cnt=()=>{$('#cnt').textContent=st.sel.size?st.sel.size+' ta tanlandi':'';$('#nx').disabled=!st.sel.size};
 let gl=[],shown=[];
 const draw=()=>{const v=$('#q').value.toLowerCase();shown=gl.filter(x=>x.title.toLowerCase().includes(v));
  $('#gl').innerHTML=shown.map(x=>`<div class="gr ${st.sel.has(x.id)?'on':''}" data-g="${x.id}"><div class="av" style="background:hsl(${Math.abs(x.id)%360},60%,45%)">${esc((x.title[0]||'?').toUpperCase())}</div>
  <div class="gt"><b>${esc(x.title)}</b>${x.n?`<span>${x.n} a'zo</span>`:''}</div><div class="ck">✓</div></div>`).join('')||(gl.length?'<p class="mut" style="padding:8px">Hech narsa topilmadi</p>':'');cnt()};
 $('#gl').onclick=e=>{const r=e.target.closest('.gr');if(!r)return;const i=+r.dataset.g,x=gl.find(y=>y.id===i);st.sel.has(i)?st.sel.delete(i):st.sel.set(i,x.title);r.classList.toggle('on',st.sel.has(i));cnt()};
 const poll=async f=>{if(g!==gen||!$('#gl'))return;
  try{const r=await api('groups'+(f?'?refresh=1':''));if(g!==gen||!$('#gl'))return;gl=r.d;draw();
   $('#gs').textContent=r.err?'Xato: '+r.err:r.done?(gl.length?'✅ '+gl.length+' ta guruh topildi':'Guruh topilmadi. Akkauntingiz guruhga a\'zo ekanini tekshiring.'):'Yuklanmoqda… '+gl.length+' ta topildi';
   if(!r.done)setTimeout(()=>poll(),1200)}catch(e){if(e.message!=='login'&&$('#gs'))$('#gs').textContent='Xato: '+e.message}};
 poll();$('#rf').onclick=()=>{$('#gs').textContent='Yangilanmoqda…';poll(1)};cnt();
 $('#q').oninput=draw;$('#all').onclick=()=>{shown.forEach(x=>st.sel.set(x.id,x.title));draw()};$('#none').onclick=()=>{st.sel.clear();draw()};
 $('#bk').onclick=()=>{st.step=1;show()};$('#nx').onclick=()=>{st.step=3;show()}}
const PRE=[10,30,60,180,360,720,1440];
async function vStep3(g){const p=(await api('posts')).find(x=>x.id==st.ad);if(g!==gen)return;if(!p){st.step=1;return show()}
 st.iv=Math.max(+st.iv||60,st.min);
 V.innerHTML=pills(3)+`<div class="c"><h2>Necha daqiqada bir yuborilsin?</h2><div>${PRE.filter(m=>m>=st.min).map(m=>`<span class="pre ${st.iv==m?'on':''}" data-m="${m}">${fmt(m)}</span>`).join('')}</div>
 <div class="mut" style="margin:10px 0 4px">Yoki o'zingiz kiriting (daqiqada):</div><input id="iv" type="number" min="${st.min}" value="${st.iv}"></div>
 <div class="c"><h2>Xulosa</h2><div class="post" style="cursor:default"><div class="pi">${KI[p.kind]||'📝'}</div><div class="jm"><div class="pp">${esc(p.preview)}</div></div></div>
 <div id="sm" class="mut" style="white-space:pre-line"></div><p class="mut" style="margin-top:6px">${st.edit?'O\'zgarishlar darhol kuchga kiradi.':'«Saqlash» bosilgach birinchi yuborish darhol bo\'ladi, keyin shu vaqt oralig\'ida takrorlanadi.'}</p></div>
 <div class="acts"><button class="g" id="bk">← Orqaga</button><button id="mk">${st.edit?'💾 O\'zgarishlarni saqlash':'✅ Saqlash va boshlash'}</button></div>`;
 const sm=()=>$('#sm').textContent=st.sel.size+' ta guruhga · har '+fmt(+st.iv||0)+' da'+((+st.iv||0)<30?'\n⚠️ 30 daqiqadan tez-tez yuborish akkauntingiz cheklanishiga olib kelishi mumkin.':'');sm();
 V.querySelectorAll('.pre').forEach(c=>c.onclick=()=>{st.iv=+c.dataset.m;$('#iv').value=st.iv;V.querySelectorAll('.pre').forEach(x=>x.classList.toggle('on',x===c));sm()});
 $('#iv').oninput=e=>{st.iv=+e.target.value;V.querySelectorAll('.pre').forEach(x=>x.classList.toggle('on',+x.dataset.m==st.iv));sm()};
 $('#bk').onclick=()=>{st.step=2;show()};
 $('#mk').onclick=async e=>{const iv=parseInt($('#iv').value);if(!iv||iv<st.min)return toast('Eng kamida '+st.min+' daqiqa');e.target.disabled=true;
  try{const body={ad_id:st.ad,chats:[...st.sel].map(([id,title])=>({id,title})),interval:iv};
   if(st.edit){await api('jobs/'+st.edit,'PUT',body);const id=st.edit;resetWizard();st.jobId=id;tab='home';nav();toast('Saqlandi ✅');show()}
   else{await api('jobs','POST',body);st.mode='done';show()}}catch(x){e.target.disabled=false}}}
function vDone(){V.innerHTML=`<div class="c" style="text-align:center;padding:22px 10px"><span style="font-size:56px;display:block">🎉</span><h2 style="font-size:20px">E'lon ishga tushdi!</h2><p class="mut" style="margin:6px 0 14px">Birinchi yuborish bir necha soniyada boshlanadi. Holatini bosh sahifada ko'rasiz.</p>
 <button id="more" style="width:100%;margin-bottom:8px">➕ Yana e'lon qo'shish</button><button class="g" id="jb" style="width:100%">🏠 Bosh sahifa</button></div>`;
 $('#more').onclick=()=>{resetWizard();show()};$('#jb').onclick=()=>{resetWizard();st.jobId=null;tab='home';nav();show()}}
/* ---------- statistika, akkaunt, tekshiruv ---------- */
async function vStat(g){const s=await api('stats');if(g!==gen)return;const mx=Math.max(1,...s.chats.map(c=>c.n));
 V.innerHTML=`<div class="c row"><div class="stat"><div class="big" data-cu="${s.total}">0</div><div class="mut">yuborildi</div></div><div class="stat"><div class="big" data-cu="${s.replies}">0</div><div class="mut">reply</div></div><div class="stat"><div class="big" data-cu="${s.people}">0</div><div class="mut">odam</div></div></div>
 <div class="sh2">Guruhlar bo'yicha</div>${s.chats.map(c=>`<div class="c"><div class="row"><b>${esc(c.title)}</b><span class="mut">${c.n} marta</span></div><div class="mut">${c.rep} reply · ${c.ppl} kishi</div><div class="bar" style="width:${c.n/mx*100}%"></div></div>`).join('')||'<div class="c empty">Hozircha statistika yo\'q</div>'}`}
async function vAcc(g){const s=await api('state');if(g!==gen)return;
 V.innerHTML=`<div class="c"><h2>Ulangan akkaunt</h2><div class="row" style="justify-content:flex-start"><div class="av" style="width:46px;height:46px;font-size:18px">${esc((s.me||'?')[0].toUpperCase())}</div><div><b>${esc(s.me)}</b><div class="mut">${s.phone?'+'+esc(s.phone):''}</div></div></div></div>
 <div class="c"><h2>Boshqa raqam ulash</h2><p class="mut" style="margin-bottom:10px">Akkaunt serverdan uziladi, barcha e'lonlar va statistika o'chiriladi. Keyin boshqa raqam bilan kirishingiz mumkin.</p><button class="d" id="lo" style="width:100%">Akkauntni uzish</button></div>
 <button class="g" id="dg" style="width:100%;margin-bottom:10px">🩺 Tekshiruv (muammo bo'lsa bosing)</button><p class="mut">Telegram → Sozlamalar → Qurilmalar orqali ham istalgan payt uzishingiz mumkin.</p>`;$('#dg').onclick=showDiag;
 $('#lo').onclick=async()=>{if(!await ask('Akkauntni uzib, barcha e\'lonlarni o\'chiraymi?','Uzish',true))return;await api('logout','POST');resetWizard();st.jobId=null;tab='home';toast('Akkaunt uzildi');login()}}
async function showDiag(){V.innerHTML='<div class="c"><h2>🩺 Tekshiruv</h2><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
 try{const [d,h]=await Promise.all([api('diag'),fetch('/health').then(r=>r.json())]);
 V.innerHTML=`<div class="c"><h2>🩺 Tekshiruv</h2>${d.map(x=>`<div class="post" style="cursor:default"><div class="jm"><b>${x.ok?'✅':'❌'} ${esc(x.n)}</b> <span class="mut">${x.ms} ms</span><div class="${x.ok?'mut':'err'}">${esc(x.d)}</div></div></div>`).join('')}
 <div class="mut" style="margin-top:10px">Server v${esc(h.v)} · telethon ${esc(h.telethon)} · bot ${h.bot?'✅':'❌ '+esc(h.bot_err)} · WEBAPP_URL ${h.webapp?'✅':'❌'} · ulangan akkauntlar: ${h.users}</div>
 <button class="g" id="bk" style="width:100%;margin-top:10px">← Orqaga</button></div>`;$('#bk').onclick=boot}
 catch(e){if(e.message!=='login'){V.innerHTML=`<div class="c"><b>Xato</b><div class="err">${esc(e.message)}</div><button class="g" id="bk" style="width:100%;margin-top:10px">← Orqaga</button></div>`;$('#bk').onclick=boot}}}
setInterval(async()=>{if(!st.authed||document.hidden)return;try{const s=await api('state');if(!s.auth&&st.authed){st.authed=false;toast('Akkaunt Telegram\'dan uzilgan. Qaytadan ulang');login()}}catch(e){}},30000);
setInterval(()=>{if(!st.authed||document.hidden||tab!=='home'||st.jobId)return;if(!document.querySelector('.ov'))show(true)},15000);   // bosh sahifa jonli yangilanadi
boot();
</script></body></html>
