<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PostBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e1424;--card:rgba(255,255,255,.08);--tx:#f2f5ff;--mut:#9aa7c7;--a:#4fd1c5;--b:#7c6cff;--bad:#ff6b8a}
@media(prefers-color-scheme:light){:root{--bg:#eef2ff;--card:rgba(255,255,255,.75);--tx:#141a33;--mut:#5b6690}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:16px 14px 90px;overflow-x:hidden}
.blob{position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(70px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.b1{background:var(--b);top:-80px;left:-90px}.b2{background:var(--a);bottom:-100px;right:-80px;animation-delay:-7s}
@keyframes fl{to{transform:translate(60px,80px) scale(1.2)}}
h1{font-size:24px;margin:4px 0 14px}h2{font-size:17px;margin:14px 0 8px}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:12px 14px;margin-bottom:10px;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
button,input{font:inherit;border:0;border-radius:14px;padding:11px 14px;color:var(--tx)}
input{width:100%;background:var(--card);border:1px solid rgba(255,255,255,.15);margin-bottom:8px}
button{background:linear-gradient(135deg,var(--b),var(--a));color:#fff;font-weight:600;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.94)}button.g{background:var(--card);color:var(--tx)}button.s{padding:7px 11px;font-size:13px}
button.d{background:var(--bad)}
.chip{display:inline-block;padding:8px 12px;margin:3px;border-radius:99px;background:var(--card);border:1px solid transparent;transition:.2s;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--b),var(--a));color:#fff;transform:scale(1.04)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid rgba(255,255,255,.1)}
nav button{flex:1;background:none;color:var(--mut);padding:9px 2px;font-size:12px}nav button.on{color:var(--tx);background:var(--card);box-shadow:0 0 0 1px rgba(124,108,255,.5)}
.big{font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat{flex:1;text-align:center}
.bar{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--b),var(--a));margin-top:6px;transition:width .8s}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;animation:in .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.item{padding:10px 12px;border-radius:12px;margin:5px 0;background:var(--card);border:1px solid transparent;cursor:pointer;transition:.2s}.item.on{border-color:var(--a);background:rgba(79,209,197,.22)}.err{color:var(--bad);font-size:13px;margin-top:6px}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<h1>📣 PostBot</h1><div id="who" class="mut" style="margin:-8px 0 10px"></div><div id="v"></div>
<nav id="nav" hidden></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=s=>document.querySelector(s),V=$('#v');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
async function api(p,m='GET',b){const c=new AbortController();setTimeout(()=>c.abort(),90000);const r=await fetch('/api/'+p,{method:m,signal:c.signal,headers:{'X-Init-Data':tg.initData,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).catch(()=>{throw new Error('Server javob bermadi (vaqt tugadi)')});
 const j=await r.json().catch(()=>({}));if(!r.ok){const m=j.detail||('Xato '+r.status);toast(m);throw new Error(m)}return j}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),5000)}
const TABS=[['new','🚀 Yuborish'],['jobs','📋 Vazifalar'],['stat','📊 Statistika'],['acc','👤 Akkaunt']];let tab='new';
const st={msg:null,title:'',sel:new Map(),iv:60,min:5};
function nav(){const n=$('#nav');n.hidden=false;n.innerHTML=TABS.map(([k,t])=>`<button class="${k==tab?'on':''}" data-k="${k}">${t}</button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;nav();show()})}
async function boot(){const s=await api('state');st.min=s.min||5;if(s.auth){$('#who').textContent='👤 '+(s.me||'?');nav();show()}else login()}
function login(){V.innerHTML=`<div class="card"><h2>Telegram akkauntga kirish</h2><p class="mut" style="margin-bottom:10px">Telefon raqamingizni kiriting. Kod Telegram'ga keladi. Har kim o'z akkauntini ulaydi va faqat o'z ma'lumotlarini ko'radi.</p><p class="mut" style="margin-bottom:10px">⚠️ Akkaunt kaliti shu xizmat serverida saqlanadi, istalgan payt «Akkaunt» bo'limidan uzishingiz mumkin. Juda tez-tez yoki ko'p guruhga yuborish Telegram tomonidan cheklanishga olib kelishi mumkin, mas'uliyat o'zingizda.</p>
 <input id="ph" placeholder="+998901234567" inputmode="tel"><button id="go" style="width:100%">Kod yuborish</button></div>`;
 $('#go').onclick=async()=>{await api('send_code','POST',{phone:$('#ph').value.trim()});
  V.innerHTML=`<div class="card"><h2>Kodni kiriting</h2><input id="cd" placeholder="12345" inputmode="numeric"><input id="pw" type="password" placeholder="2 bosqichli parol (bo'lsa)">
  <button id="ok" style="width:100%">Kirish</button></div>`;
  $('#ok').onclick=async()=>{const r=await api('login','POST',{code:$('#cd').value.trim(),password:$('#pw').value});
   if(r.need_password)return toast('2 bosqichli parolni kiriting');toast('Kirildi ✅');boot()}}}
async function show(){V.innerHTML='<div class="card mut">Yuklanmoqda… (guruhlar ko\'p bo\'lsa 1 daqiqagacha cho\'zilishi mumkin)</div>';
 try{await ({new:vNew,jobs:vJobs,stat:vStat,acc:vAcc})[tab]()}catch(e){V.innerHTML=`<div class="card"><b>Xato</b><div class="mut">${esc(e.message)}</div></div>`}}
async function vNew(){const [s,g]=await Promise.all([api('saved'),api('groups')]);
 V.innerHTML=`<div class="card"><h2>1. E'lonni tanlang</h2><p class="mut">E'lonni Telegram'dagi <b>Saqlangan xabarlar</b>ga yozing (video, premium emoji, stiker ham bo'ladi), keyin shu yerda tanlang.</p>
 ${s.map(m=>`<div class="item ${st.msg==m.id?'on':''}" data-m="${m.id}" data-t="${esc(m.text.slice(0,25)||m.kind)}"><span class="mut">${m.kind}</span> ${esc(m.text)||'(matnsiz)'}</div>`).join('')||'<p class="mut">Saqlangan xabarlar bo\'sh</p>'}</div>
 <div class="card"><h2>2. Guruhlarni tanlang <span id="cnt" class="mut"></span></h2><input id="q" placeholder="Guruhni qidirish...">
 <button class="s g" id="all">Ko'ringanlarini tanlash</button> <button class="s g" id="none">Tozalash</button>
 <div id="gl" style="margin-top:6px">${g.map(x=>`<span class="chip ${st.sel.has(x.id)?'on':''}" data-g="${x.id}" data-t="${esc(x.title)}">${esc(x.title)}</span>`).join('')||'<p class="mut">Guruh topilmadi. Akkauntingiz guruhga a\'zo ekanini tekshiring.</p>'}</div></div>
 <div class="card"><h2>3. Necha daqiqada bir yuborilsin?</h2><input id="iv" type="number" min="${st.min}" value="${Math.max(st.iv,st.min)}">
 <p class="mut" style="margin-bottom:8px">"Boshlash" bosilgach birinchi yuborish darhol bo'ladi, keyin har shuncha daqiqada takrorlanadi.</p><button id="mk" style="width:100%">🚀 Boshlash</button></div>`;
 const cnt=()=>$('#cnt').textContent='('+st.sel.size+' ta)';cnt();
 V.querySelectorAll('.item').forEach(i=>i.onclick=()=>{st.msg=+i.dataset.m;st.title=i.dataset.t;V.querySelectorAll('.item').forEach(x=>x.classList.toggle('on',x===i))});
 const chips=[...V.querySelectorAll('[data-g]')];
 chips.forEach(c=>c.onclick=()=>{const i=+c.dataset.g;st.sel.has(i)?st.sel.delete(i):st.sel.set(i,c.dataset.t);c.classList.toggle('on',st.sel.has(i));cnt()});
 $('#q').oninput=e=>chips.forEach(c=>c.style.display=c.dataset.t.toLowerCase().includes(e.target.value.toLowerCase())?'':'none');
 $('#all').onclick=()=>{chips.filter(c=>c.style.display!='none').forEach(c=>{st.sel.set(+c.dataset.g,c.dataset.t);c.classList.add('on')});cnt()};
 $('#none').onclick=()=>{st.sel.clear();chips.forEach(c=>c.classList.remove('on'));cnt()};
 $('#iv').oninput=e=>st.iv=e.target.value;
 $('#mk').onclick=async()=>{if(!st.msg)return toast('1-qadam: e\'lonni tanlang');if(!st.sel.size)return toast('2-qadam: guruh tanlang');
  const iv=parseInt($('#iv').value);if(!iv||iv<st.min)return toast('Eng kamida '+st.min+' daqiqa');
  await api('jobs','POST',{msg_id:st.msg,title:st.title,chats:[...st.sel].map(([id,title])=>({id,title})),interval:iv});
  st.msg=null;st.sel.clear();toast('Boshlandi ✅');tab='jobs';nav();show()}}
async function vJobs(){const j=await api('jobs');
 V.innerHTML=j.map(x=>`<div class="card"><div class="row"><b>${esc(x.title)}</b><span class="mut">${x.chats.length} guruh · ${x.interval} daq</span></div>
 <div class="mut">${x.active?'Keyingi yuborish: '+new Date(Math.max(x.next_run,Date.now()/1000)*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'To\'xtatilgan'}</div>
 ${x.err?`<div class="err">Xato: ${esc(x.err)}</div>`:''}
 <div class="row" style="margin-top:8px"><button class="s" data-n="${x.id}">Hozir yuborish</button><button class="s g" data-p="${x.id}">${x.active?'⏸ To\'xtatish':'▶️ Yoqish'}</button><button class="s d" data-x="${x.id}">🗑</button></div></div>`).join('')||'<div class="card mut">Hali vazifa yo\'q. "Yuborish" bo\'limidan boshlang.</div>';
 const act=(k,f)=>V.querySelectorAll(`[data-${k}]`).forEach(b=>b.onclick=async()=>{await f(b.dataset[k]);toast('Bajarildi');show()});
 act('n',i=>api(`jobs/${i}/now`,'POST'));act('p',i=>api(`jobs/${i}/toggle`,'POST'));act('x',i=>api('jobs/'+i,'DELETE'))}
async function vAcc(){const s=await api('state');
 V.innerHTML=`<div class="card"><h2>Ulangan akkaunt</h2><b>${esc(s.me)}</b><div class="mut">${s.phone?'+'+esc(s.phone):''}</div></div>
 <div class="card"><h2>Boshqa raqam ulash</h2><p class="mut" style="margin-bottom:8px">Bosganingizda akkauntingiz serverdan uziladi, barcha vazifalar va statistika o'chiriladi. Keyin boshqa raqam bilan kirishingiz mumkin.</p><button class="d" id="lo" style="width:100%">Akkauntni uzish</button></div>
 <p class="mut">Telegram → Sozlamalar → Qurilmalar orqali ham istalgan payt uzishingiz mumkin.</p>`;
 $('#lo').onclick=()=>tg.showConfirm('Akkauntni uzib, barcha vazifalarni o\'chiraymi?',async ok=>{if(!ok)return;await api('logout','POST');st.sel.clear();st.msg=null;$('#nav').hidden=true;$('#who').textContent='';toast('Akkaunt uzildi');login()})}
async function vStat(){const s=await api('stats'),mx=Math.max(1,...s.chats.map(c=>c.n));
 V.innerHTML=`<div class="card row"><div class="stat"><div class="big">${s.total}</div><div class="mut">yuborildi</div></div><div class="stat"><div class="big">${s.replies}</div><div class="mut">reply</div></div><div class="stat"><div class="big">${s.people}</div><div class="mut">odam</div></div></div>
 <h2>Guruhlar bo'yicha</h2>${s.chats.map(c=>`<div class="card"><div class="row"><b>${esc(c.title)}</b><span class="mut">${c.n} marta</span></div><div class="mut">${c.rep} reply · ${c.ppl} kishi</div><div class="bar" style="width:${c.n/mx*100}%"></div></div>`).join('')||'<p class="mut">Hozircha statistika yo\'q</p>'}`}
boot();
</script></body></html>
