<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PostBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0f1f;--tx:#eef2ff;--mut:#93a0c6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--a:#38e1c6;--b:#7b6cff;--bad:#ff6b8a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:14px 14px calc(92px + env(safe-area-inset-bottom));overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:-1;animation:fl 16s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:var(--b);top:-100px;left:-100px}.b2{width:300px;height:300px;background:var(--a);bottom:-110px;right:-90px;animation-delay:-8s;opacity:.35}
@keyframes fl{to{transform:translate(70px,90px) scale(1.25)}}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.logo{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}.logo i{font-style:normal;display:inline-block;animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-12deg) scale(1.1)}}
.chip-me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);animation:in .4s}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;background:linear-gradient(135deg,var(--b),var(--a))}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--a));font-size:12px;margin-right:6px;color:#fff}
button,input{font:inherit;border:0;border-radius:14px;padding:12px 14px;color:var(--tx)}
input{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);margin-bottom:8px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--a)}
button{background:linear-gradient(135deg,var(--b),var(--a));color:#fff;font-weight:700;cursor:pointer;transition:transform .15s,opacity .2s}
button:active{transform:scale(.95)}button:disabled{opacity:.5}
button.g{background:var(--card);border:1px solid var(--line);color:var(--tx);font-weight:500}button.s{padding:8px 12px;font-size:13px;border-radius:12px}button.d{background:var(--bad)}
.item{padding:10px 12px;border-radius:14px;margin:6px 0;background:rgba(255,255,255,.05);border:1px solid transparent;cursor:pointer;transition:.2s;word-break:break-word}
.item.on{border-color:var(--a);background:rgba(56,225,198,.16)}
#gl{max-height:46vh;overflow-y:auto;margin-top:8px;border-radius:14px}
.gr{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;cursor:pointer;transition:background .2s}
.gr:active{background:rgba(255,255,255,.08)}.gr.on{background:rgba(56,225,198,.14)}
.gt{flex:1;min-width:0}.gt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gt span{font-size:12px;color:var(--mut)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent;transition:.2s;flex:none}
.gr.on .ck{background:var(--a);border-color:var(--a);color:#06241f;animation:pop .25s}
@keyframes pop{50%{transform:scale(1.3)}}
.sk{height:50px;border-radius:14px;margin:6px 0;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.13),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(10,15,31,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;background:none;color:var(--mut);padding:9px 2px;font-size:12px;font-weight:600}nav button.on{color:var(--tx);background:var(--card);box-shadow:0 0 0 1px rgba(123,108,255,.55)}
.big{font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat{flex:1;text-align:center}.bar{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--b),var(--a));margin-top:6px}
.err{color:var(--bad);font-size:13px;margin-top:6px;word-break:break-word}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);max-width:90%;background:#fff;color:#111;padding:10px 16px;border-radius:16px;animation:in .3s;z-index:9;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.steps{display:flex;gap:6px;margin-bottom:12px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line);transition:.4s}.steps i.on{background:linear-gradient(90deg,var(--b),var(--a))}
.hero{text-align:center;padding:10px 0 4px}.hero .em{font-size:46px;animation:wob 3s ease-in-out infinite;display:block}
.code{font-size:26px;letter-spacing:10px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<header><div class="logo"><i>📣</i> PostBot</div><div id="me" class="chip-me"></div></header>
<div id="v"></div><nav id="nav" hidden></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#0a0f1f');tg.setBackgroundColor('#0a0f1f')}catch(e){}
const $=s=>document.querySelector(s),V=$('#v');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const st={msg:null,title:'',sel:new Map(),iv:60,min:5,me:'',authed:false};let tab='new',gen=0;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),4500)}
async function api(p,m='GET',b){const c=new AbortController();const to=setTimeout(()=>c.abort(),90000);
 const r=await fetch('/api/'+p,{method:m,signal:c.signal,headers:{'X-Init-Data':tg.initData,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).catch(()=>{throw new Error('Server javob bermadi')});clearTimeout(to);
 const j=await r.json().catch(()=>({}));
 if(r.status==401){gen++;login();throw new Error('login')}
 if(!r.ok){const e=j.detail||('Xato '+r.status);toast(e);throw new Error(e)}return j}
const TABS=[['new','🚀 Yuborish'],['jobs','📋 Vazifalar'],['stat','📊 Statistika'],['acc','👤 Akkaunt']];
function nav(){const n=$('#nav');n.hidden=false;n.innerHTML=TABS.map(([k,t])=>`<button class="${k==tab?'on':''}" data-k="${k}">${t}</button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;nav();show()})}
function setMe(n){$('#me').innerHTML=n?`<div class="av">${esc(n[0].toUpperCase())}</div>${esc(n)}`:''}
async function boot(){gen++;try{const s=await api('state');st.min=s.min||5;
 if(s.auth){st.authed=true;st.me=s.me;setMe(s.me);nav();show()}else login()}catch(e){if(e.message!=='login')V.innerHTML=`<div class="card"><b>Xato</b><div class="err">${esc(e.message)}</div></div>`}}
/* ---------- kirish ---------- */
function login(step=1){st.authed=false;$('#nav').hidden=true;setMe('');
 const bar=n=>`<div class="steps"><i class="on"></i><i class="${n>1?'on':''}"></i><i class="${n>2?'on':''}"></i></div>`;
 if(step==1){V.innerHTML=`<div class="card"><div class="hero"><span class="em">📱</span><h2 style="font-size:20px">Telegram akkauntni ulang</h2><p class="mut">Telefon raqamingizni kiriting, Telegram'ga kod keladi.</p></div>${bar(1)}
 <input id="ph" value="+998" inputmode="tel" autocomplete="tel"><button id="go" style="width:100%">Kod yuborish</button>
 <p class="mut" style="margin-top:10px">Akkaunt kaliti shu xizmat serverida saqlanadi, «Akkaunt» bo'limidan istalgan payt uzishingiz mumkin. Juda tez-tez yoki ko'p guruhga yuborish Telegram tomonidan cheklanishga olib kelishi mumkin.</p><button class="g s" id="dg" style="margin-top:10px">🩺 Tekshiruv</button></div>`;$('#dg').onclick=showDiag;
  $('#go').onclick=async e=>{const b=e.target;b.disabled=true;try{const r=await api('send_code','POST',{phone:$('#ph').value});if(r.already){boot();return}login(2)}catch(x){if(x.message!=='login')b.disabled=false}}}
 else if(step==2){V.innerHTML=`<div class="card"><div class="hero"><span class="em">💬</span><h2 style="font-size:20px">Kodni kiriting</h2><p class="mut">Kod Telegram'dagi «Telegram» chatiga keldi. Uni hech kimga yubormang.</p></div>${bar(2)}
 <input id="cd" class="code" placeholder="•••••" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="ok" style="width:100%">Kirish</button><button class="g" id="bk" style="width:100%;margin-top:8px">← Raqamni o'zgartirish</button></div>`;
  $('#bk').onclick=()=>login(1);$('#ok').onclick=()=>doLogin()}
 else{V.innerHTML=`<div class="card"><div class="hero"><span class="em">🔐</span><h2 style="font-size:20px">2 bosqichli parol</h2><p class="mut">Akkauntingizda parol yoqilgan. Uni kiriting.</p></div>${bar(3)}
 <input id="pw" type="password" placeholder="Parol"><button id="ok" style="width:100%">Kirish</button></div>`;$('#ok').onclick=()=>doLogin(1)}}
let lastCode='';
async function doLogin(pw){const b=$('#ok');b.disabled=true;
 try{const r=await api('login','POST',pw?{password:$('#pw').value}:{code:$('#cd').value.trim()});
  if(r.need_password){login(3);return}toast('Ulandi ✅');tab='new';boot()}catch(x){if(x.message!=='login')b.disabled=false}}
/* ---------- bo'limlar ---------- */
async function show(){const g=++gen;V.innerHTML='<div class="card"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
 try{await ({new:vNew,jobs:vJobs,stat:vStat,acc:vAcc})[tab](g)}catch(e){if(e.message!=='login'&&g===gen)V.innerHTML=`<div class="card"><b>Xato</b><div class="err">${esc(e.message)}</div></div>`}}
async function vNew(g){const s=await api('saved');if(g!==gen)return;
 V.innerHTML=`<div class="card"><h2><span class="num">1</span>E'lonni tanlang</h2><p class="mut">E'lonni Telegram'dagi <b>Saqlangan xabarlar</b>ga yozing (video, premium emoji, stiker ham bo'ladi), keyin shu yerda tanlang.</p>
 ${s.map(m=>`<div class="item ${st.msg==m.id?'on':''}" data-m="${m.id}" data-t="${esc(m.text.slice(0,25)||m.kind)}"><span class="mut">${m.kind}</span> ${esc(m.text)||'(matnsiz)'}</div>`).join('')||'<p class="mut" style="margin-top:8px">Saqlangan xabarlar bo\'sh. Avval Telegram\'da o\'zingizga e\'lon yozing.</p>'}</div>
 <div class="card"><div class="row"><h2><span class="num">2</span>Guruhlarni tanlang</h2><span id="cnt" class="mut"></span></div><div id="gs" class="mut">Guruhlar yuklanmoqda…</div>
 <input id="q" placeholder="🔍 Guruhni qidirish" style="margin-top:8px"><div class="row" style="justify-content:flex-start;flex-wrap:wrap">
 <button class="s g" id="all">Ko'ringanlarini tanlash</button><button class="s g" id="none">Tozalash</button><button class="s g" id="rf">🔄</button></div>
 <div id="gl"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
 <div class="card"><h2><span class="num">3</span>Necha daqiqada bir yuborilsin?</h2><input id="iv" type="number" min="${st.min}" value="${Math.max(st.iv,st.min)}">
 <p class="mut" style="margin-bottom:10px">«Boshlash» bosilgach birinchi yuborish darhol bo'ladi, keyin har shuncha daqiqada takrorlanadi. Eng kamida ${st.min} daqiqa.</p><button id="mk" style="width:100%">🚀 Boshlash</button></div>`;
 const cnt=()=>$('#cnt').textContent=st.sel.size?st.sel.size+' ta tanlandi':'';
 V.querySelectorAll('.item').forEach(i=>i.onclick=()=>{st.msg=+i.dataset.m;st.title=i.dataset.t;V.querySelectorAll('.item').forEach(x=>x.classList.toggle('on',x===i))});
 let gl=[],shown=[];
 const draw=()=>{const v=$('#q').value.toLowerCase();shown=gl.filter(x=>x.title.toLowerCase().includes(v));
  $('#gl').innerHTML=shown.map(x=>`<div class="gr ${st.sel.has(x.id)?'on':''}" data-g="${x.id}"><div class="av" style="background:hsl(${Math.abs(x.id)%360},60%,45%)">${esc((x.title[0]||'?').toUpperCase())}</div>
  <div class="gt"><b>${esc(x.title)}</b>${x.n?`<span>${x.n} a'zo</span>`:''}</div><div class="ck">✓</div></div>`).join('')||(gl.length?'<p class="mut" style="padding:8px">Hech narsa topilmadi</p>':'');cnt()};
 $('#gl').onclick=e=>{const r=e.target.closest('.gr');if(!r)return;const i=+r.dataset.g,x=gl.find(y=>y.id===i);
  st.sel.has(i)?st.sel.delete(i):st.sel.set(i,x.title);r.classList.toggle('on',st.sel.has(i));cnt()};
 const poll=async f=>{if(g!==gen||!$('#gl'))return;
  try{const r=await api('groups'+(f?'?refresh=1':''));if(g!==gen||!$('#gl'))return;gl=r.d;draw();
   $('#gs').textContent=r.err?'Xato: '+r.err:r.done?(gl.length?'✅ '+gl.length+' ta guruh topildi':'Guruh topilmadi. Akkauntingiz guruhga a\'zo ekanini tekshiring.'):'Yuklanmoqda… '+gl.length+' ta topildi';
   if(!r.done)setTimeout(()=>poll(),1200)}catch(e){if(e.message!=='login'&&$('#gs'))$('#gs').textContent='Xato: '+e.message}};
 poll();$('#rf').onclick=()=>{$('#gs').textContent='Yangilanmoqda…';poll(1)};
 $('#q').oninput=draw;
 $('#all').onclick=()=>{shown.forEach(x=>st.sel.set(x.id,x.title));draw()};
 $('#none').onclick=()=>{st.sel.clear();draw()};
 $('#iv').oninput=e=>st.iv=e.target.value;
 $('#mk').onclick=async()=>{if(!st.msg)return toast('1-qadam: e\'lonni tanlang');if(!st.sel.size)return toast('2-qadam: guruh tanlang');
  const iv=parseInt($('#iv').value);if(!iv||iv<st.min)return toast('Eng kamida '+st.min+' daqiqa');
  await api('jobs','POST',{msg_id:st.msg,title:st.title,chats:[...st.sel].map(([id,title])=>({id,title})),interval:iv});
  st.msg=null;st.sel.clear();toast('Boshlandi ✅');tab='jobs';nav();show()}}
async function vJobs(g){const j=await api('jobs');if(g!==gen)return;
 V.innerHTML=j.map(x=>`<div class="card"><div class="row"><b>${esc(x.title)}</b><span class="mut">${x.chats.length} guruh · ${x.interval} daq</span></div>
 <div class="mut">${x.active?'Keyingi yuborish: '+new Date(Math.max(x.next_run,Date.now()/1000)*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'⏸ To\'xtatilgan'}</div>
 ${x.err?`<div class="err">Xato: ${esc(x.err)}</div>`:''}
 <div class="row" style="margin-top:10px"><button class="s" data-n="${x.id}">Hozir yuborish</button><button class="s g" data-p="${x.id}">${x.active?'⏸ To\'xtatish':'▶️ Yoqish'}</button><button class="s d" data-x="${x.id}">🗑</button></div></div>`).join('')||'<div class="card mut">Hali vazifa yo\'q. «Yuborish» bo\'limidan boshlang.</div>';
 const act=(k,f)=>V.querySelectorAll(`[data-${k}]`).forEach(b=>b.onclick=async()=>{await f(b.dataset[k]);toast('Bajarildi');show()});
 act('n',i=>api(`jobs/${i}/now`,'POST'));act('p',i=>api(`jobs/${i}/toggle`,'POST'));act('x',i=>api('jobs/'+i,'DELETE'))}
async function vStat(g){const s=await api('stats');if(g!==gen)return;const mx=Math.max(1,...s.chats.map(c=>c.n));
 V.innerHTML=`<div class="card row"><div class="stat"><div class="big">${s.total}</div><div class="mut">yuborildi</div></div><div class="stat"><div class="big">${s.replies}</div><div class="mut">reply</div></div><div class="stat"><div class="big">${s.people}</div><div class="mut">odam</div></div></div>
 <h2 style="margin:6px 2px 8px">Guruhlar bo'yicha</h2>${s.chats.map(c=>`<div class="card"><div class="row"><b>${esc(c.title)}</b><span class="mut">${c.n} marta</span></div><div class="mut">${c.rep} reply · ${c.ppl} kishi</div><div class="bar" style="width:${c.n/mx*100}%"></div></div>`).join('')||'<div class="card mut">Hozircha statistika yo\'q</div>'}`}
async function vAcc(g){const s=await api('state');if(g!==gen)return;
 V.innerHTML=`<div class="card"><h2>Ulangan akkaunt</h2><div class="row" style="justify-content:flex-start"><div class="av" style="width:44px;height:44px;font-size:18px">${esc((s.me||'?')[0].toUpperCase())}</div><div><b>${esc(s.me)}</b><div class="mut">${s.phone?'+'+esc(s.phone):''}</div></div></div></div>
 <div class="card"><h2>Boshqa raqam ulash</h2><p class="mut" style="margin-bottom:10px">Bosganingizda akkaunt serverdan uziladi, barcha vazifalar va statistika o'chiriladi. Keyin boshqa raqam bilan kirishingiz mumkin.</p><button class="d" id="lo" style="width:100%">Akkauntni uzish</button></div>
 <button class="g" id="dg" style="width:100%;margin-bottom:10px">🩺 Tekshiruv (muammo bo'lsa bosing)</button><p class="mut">Telegram → Sozlamalar → Qurilmalar orqali ham istalgan payt uzishingiz mumkin.</p>`;$('#dg').onclick=showDiag;
 $('#lo').onclick=()=>tg.showConfirm('Akkauntni uzib, barcha vazifalarni o\'chiraymi?',async ok=>{if(!ok)return;await api('logout','POST');st.sel.clear();st.msg=null;toast('Akkaunt uzildi');login()})}
async function showDiag(){V.innerHTML='<div class="card"><h2>🩺 Tekshiruv</h2><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
 try{const [d,h]=await Promise.all([api('diag'),fetch('/health').then(r=>r.json())]);
 V.innerHTML=`<div class="card"><h2>🩺 Tekshiruv</h2>${d.map(x=>`<div class="item" style="cursor:default"><b>${x.ok?'✅':'❌'} ${esc(x.n)}</b> <span class="mut">${x.ms} ms</span><div class="${x.ok?'mut':'err'}">${esc(x.d)}</div></div>`).join('')}
 <div class="mut" style="margin-top:10px">Server: telethon ${esc(h.telethon)} · bot ${h.bot?'✅':'❌ '+esc(h.bot_err)} · WEBAPP_URL ${h.webapp?'✅':'❌'} · ulangan akkauntlar: ${h.users}</div>
 <button class="g" id="bk" style="width:100%;margin-top:10px">← Orqaga</button></div>`;$('#bk').onclick=boot}
 catch(e){if(e.message!=='login')V.innerHTML=`<div class="card"><b>Xato</b><div class="err">${esc(e.message)}</div><button class="g" id="bk" style="width:100%;margin-top:10px">← Orqaga</button></div>`,$('#bk').onclick=boot}}
setInterval(async()=>{if(!st.authed||document.hidden)return;try{const s=await api('state');if(!s.auth&&st.authed){st.authed=false;toast('Akkaunt Telegram\'dan uzilgan. Qaytadan ulang');login()}}catch(e){}},30000);
boot();
</script></body></html>
